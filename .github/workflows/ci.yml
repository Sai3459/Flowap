# The automated check for the whole repo: backend unit + integration, the extraction service's
# Python suite, and the frontend's typecheck, build and tests.
#
# This has run on GitHub's runners since it was added and is green on every push. (It carried a
# "NOT VERIFIED — has never executed" note for a long time after that stopped being true; if you
# are about to make a claim about CI here, check the Actions tab first.)
#
# Note this workflow contains no reference to docker-compose or any Dockerfile — it uses a
# service container and runs commands directly on the runner. A green run says nothing about
# whether the compose stack builds.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — unit + integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: invoice_platform
        ports:
          - 5432:5432
        # Without this the first connection races the server's startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The harness derives the test database by appending `_test`, and creates it if absent,
      # so nothing here has to pre-create it.
      DATABASE_URL: postgresql://postgres:devpass@localhost:5432/invoice_platform
      # Both fail closed by design, so CI has to supply them or the suites cannot run. These
      # are throwaway CI values and deliberately not secrets — nothing they protect exists on
      # a runner. A real deployment reads them from a secret store.
      FILE_URL_SIGNING_KEY: ci-only-file-signing-key-not-a-secret-000000
      ERP_CREDENTIALS_KEY: ci-only-erp-credentials-key-not-a-secret-000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend

      # Pure functions and the fixture drift guard. Needs no database.
      - name: Unit tests
        run: npm test
        working-directory: backend

      # The stateful paths: ingestion, matching, workflow traversal, tenant isolation.
      - name: Integration tests
        run: npm run test:integration
        working-directory: backend

  extraction:
    name: Extraction service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: extraction-service/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: extraction-service

      # Covers the arithmetic consistency pass — the check that makes confidence mean
      # something rather than being the model's opinion of itself.
      - name: Tests
        run: python -m pytest -q
        working-directory: extraction-service

  frontend:
    name: Frontend — typecheck + build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # `npm run build` is `tsc -b && vite build`, so this typechecks and builds in one. The
      # test files are typechecked too, under their own project (tsconfig.test.json).
      - run: npm run build
        working-directory: frontend

      # Vitest + jsdom. Needs no server and no database: the suite drives the real API client
      # against a fake at the `fetch` boundary. Two of the tests read the *backend's* source off
      # disk as drift guards, which is why this job checks out the whole repo rather than just
      # frontend/.
      - name: Tests
        run: npm test
        working-directory: frontend
