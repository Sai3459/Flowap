# The first automated check this repo has ever had.
#
# NOT VERIFIED: written in a sandbox with no GitHub runner, so this has never executed. Every
# command in it was run by hand locally and passes; the workflow wiring itself is unproven
# until the first push builds.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — unit + integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: invoice_platform
        ports:
          - 5432:5432
        # Without this the first connection races the server's startup.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The harness derives the test database by appending `_test`, and creates it if absent,
      # so nothing here has to pre-create it.
      DATABASE_URL: postgresql://postgres:devpass@localhost:5432/invoice_platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: backend

      # Pure functions and the fixture drift guard. Needs no database.
      - name: Unit tests
        run: npm test
        working-directory: backend

      # The stateful paths: ingestion, matching, workflow traversal, tenant isolation.
      - name: Integration tests
        run: npm run test:integration
        working-directory: backend

  extraction:
    name: Extraction service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: extraction-service/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: extraction-service

      # Covers the arithmetic consistency pass — the check that makes confidence mean
      # something rather than being the model's opinion of itself.
      - name: Tests
        run: python -m pytest -q
        working-directory: extraction-service

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # `npm run build` is `tsc -b && vite build`, so this typechecks and builds in one.
      # There are still no frontend tests at all — see CLAUDE.md.
      - run: npm run build
        working-directory: frontend
